name: Test
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-cache
          repository-cache: true
      - name: Test extract_proto
        run: cd tests/extract_proto && bazel test --config=ci //...
      - name: Test gazelle
        run: cd tests/gazelle && bazel test --config=ci //...
      - name: Test grpc
        run: cd tests/grpc && bazel test --config=ci //...
      - name: Test helloworld
        run: cd tests/helloworld && bazel test --config=ci //...
      - name: Test proto_direct_access
        run: cd tests/proto_direct_access && bazel test --config=ci //...
      - name: Test protobuf
        run: cd tests/protobuf && bazel test --config=ci //...
      - name: Test servicetalk
        run: cd tests/servicetalk && bazel test --config=ci //...
      - name: Test zip_proto
        run: cd tests/zip_proto && bazel test --config=ci //...
      - name: Upload Test Results
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: tests/**/bazel-testlogs/**/*.xml
          if-no-files-found: ignore
      - name: Publish test results
        if: '!cancelled()'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          comment_mode: 'off'
          files: tests/**/bazel-testlogs/**/*.xml
