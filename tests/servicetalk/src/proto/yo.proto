syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.apple.bazel.servicetalk.yo.proto";
option java_outer_classname = "YoProto";

package yo;

service Yoer {
    rpc SayYo (YoRequest) returns (YoReply) {}
}

message YoRequest {
    string name = 1;
}

message YoReply {
    string message = 1;
}
